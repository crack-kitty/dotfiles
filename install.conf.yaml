- defaults:
    link:
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.zshrc: .zshrc
    ~/.gitconfig: .gitconfig
    ~/.bashrc: .bashrc
    ~/.profile: .profile

# Claude Code config - remove real dir if it exists so dotbot can symlink it
- shell:
    - command: '[ -d ~/.claude ] && [ ! -L ~/.claude ] && rm -rf ~/.claude || true'
      description: Clear ~/.claude if it is a real directory (not a symlink)

- link:
    ~/.claude: claude

# Codex CLI for the codex@openai-codex Claude Code plugin
- shell:
    - command: npm config set prefix "$HOME/.local" >/dev/null 2>&1 && (command -v codex >/dev/null 2>&1 || npm install -g @openai/codex)
      description: Install Codex CLI (user-prefix npm) if missing
      stdout: true
      stderr: true

# Sync Claude Code plugins from settings.json (idempotent)
- shell:
    - command: bash scripts/install-claude-plugins.sh
      description: Install Claude Code plugins listed in claude/settings.json
      stdout: true
      stderr: true
