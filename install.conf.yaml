- defaults:
    link:
      relink: true
      force: true

- clean: ['~']

- link:
    ~/.zshrc: .zshrc
    ~/.gitconfig: .gitconfig
    ~/.bashrc: .bashrc
    ~/.profile: .profile

- create:
    - ~/.codex

# Vendor skills (submodules) — init before symlinks resolve
- shell:
    - command: git -C ~/.dotfiles submodule update --init --recursive
      description: Initialize git submodules (vendor skills, etc.)

# Versioned git hooks and secret scanning
- shell:
    - command: '[ -x "$HOME/go/bin/gitleaks" ] || (mkdir -p "$HOME/go/bin" && os=$(uname -s | tr A-Z a-z) && arch=$(uname -m | sed "s/x86_64/x64/;s/aarch64/arm64/") && curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_${os}_${arch}.tar.gz" | tar -xzC "$HOME/go/bin" gitleaks)'
      description: Install gitleaks v8.30.1 if missing (prebuilt binary, no Go required)
      stdout: true
      stderr: true
    - command: 'command -v jq >/dev/null 2>&1 || [ -x "$HOME/.local/bin/jq" ] || (mkdir -p "$HOME/.local/bin" && os=$(uname -s | tr A-Z a-z) && case "$os" in darwin) os=macos ;; esac && arch=$(uname -m | sed "s/x86_64/amd64/;s/aarch64/arm64/") && curl -fsSL -o "$HOME/.local/bin/jq" "https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-${os}-${arch}" && chmod +x "$HOME/.local/bin/jq")'
      description: Install jq 1.8.1 to ~/.local/bin if missing (required by statusline)
      stdout: true
      stderr: true
    - command: git -C ~/.dotfiles config core.hooksPath githooks
      description: Use versioned git hooks

# Claude Code config - remove real dir if it exists so dotbot can symlink it
- shell:
    - command: '[ -d ~/.claude ] && [ ! -L ~/.claude ] && rm -rf ~/.claude || true'
      description: Clear ~/.claude if it is a real directory (not a symlink)

- link:
    ~/.claude: claude
    ~/.codex/config.toml: codex/config.toml

# Codex CLI for the codex@openai-codex Claude Code plugin
- shell:
    - command: npm config set prefix "$HOME/.local" >/dev/null 2>&1 && (command -v codex >/dev/null 2>&1 || npm install -g @openai/codex)
      description: Install Codex CLI (user-prefix npm) if missing
      stdout: true
      stderr: true

# Sync Claude Code plugins from settings.json (idempotent)
- shell:
    - command: bash scripts/install-claude-plugins.sh
      description: Install Claude Code plugins listed in claude/settings.json
      stdout: true
      stderr: true
