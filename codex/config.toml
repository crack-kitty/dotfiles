model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

[features]
multi_agent = true

[projects."/home/dave/appdev/miletrack"]
trust_level = "trusted"

[projects."/apps/onramp"]
trust_level = "trusted"

[projects."/home/dave"]
trust_level = "trusted"

[projects."/home/dave/appdev/openbrain-mcp"]
trust_level = "trusted"

[projects."/home/dave/.dotfiles"]
trust_level = "trusted"

[tui]
status_line = [
  "model-with-reasoning",
  "current-dir",
  "git-branch",
  "context-used",
]

[tui.model_availability_nux]
"gpt-5.5" = 4

[mcp_servers.n8n]
url = "https://n8n-mcp.ckcompute.xyz/mcp"
bearer_token_env_var = "N8N_MCP_TOKEN"

[mcp_servers.homeassistant]
command = "bash"
args = ["-lc", 'exec npx -y mcp-remote "$HOMEASSISTANT_MCP_URL" --allow-http']

[mcp_servers.openbrain]
url = "https://openbrain.ckcompute.xyz/mcp"
bearer_token_env_var = "OPENBRAIN_MCP_ACCESS_KEY"

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true

[plugins."superpowers@openai-curated"]
enabled = true

[hooks.state]

[hooks.state."/home/dave/.codex/hooks.json:stop:0:0"]
trusted_hash = "sha256:aae75c646a0aa7b0587ec96084a6b79f00aa176f1d12d94e65472955bc499a1e"
